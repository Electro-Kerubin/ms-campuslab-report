services:
  report-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-campuslab}
      POSTGRES_PASSWORD: ${DB_PASS:-campuslab}
      POSTGRES_DB: ${DB_NAME:-campuslab_report_db}
    volumes:
      - report-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  report-svc:
    build: .
    ports:
      - "${REPORT_SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:postgresql://report-db:5432/${DB_NAME:-campuslab_report_db}
      DB_USER: ${DB_USER:-campuslab}
      DB_PASS: ${DB_PASS:-campuslab}
      KAFKA_SERVERS: ${KAFKA_SERVERS:-kafka1:9092,kafka2:9092,kafka3:9092}
      AZURE_AD_TENANT_ID: ${AZURE_AD_TENANT_ID:-changeme}
      AZURE_AD_CLIENT_ID: ${AZURE_AD_CLIENT_ID:-changeme}
      AZURE_AD_APP_ID_URI: ${AZURE_AD_APP_ID_URI:-changeme}
    depends_on:
      report-db:
        condition: service_healthy

volumes:
  report-db-data:
