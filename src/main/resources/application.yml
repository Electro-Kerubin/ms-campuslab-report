spring:
  application:
    name: ms-campuslab-report
  datasource:
    url: jdbc:postgresql://localhost:5432/campuslab_report_db
    username: tu_usuario
    password: tu_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update # Útil para desarrollo; en prod usar 'validate' o Flyway/Liquibase
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect