spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campuslab_report_db}
    username: ${DB_USER:campuslab}
    password: ${DB_PASS:campuslab}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: report-group
      auto-offset-reset: earliest

  cloud:
    azure:
      active-directory:
        profile:
          tenant-id: ${AZURE_AD_TENANT_ID:changeme}
        credential:
          client-id: ${AZURE_AD_CLIENT_ID:changeme}
        app-id-uri: ${AZURE_AD_APP_ID_URI:changeme}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:changeme}/v2.0

server:
  port: ${SERVER_PORT:8080}
