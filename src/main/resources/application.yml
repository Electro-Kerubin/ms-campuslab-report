spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/campuslab_report_db}
    username: ${DB_USER:campuslab}
    password: ${DB_PASS:campuslab}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_GROUP_ID:report-service}
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: org.campuslab.report.dto.BookingEventMessage
        spring.json.trusted.packages: org.campuslab.report.dto
    listener:
      ack-mode: record

  cloud:
    azure:
      active-directory:
        profile:
          tenant-id: ${AZURE_AD_TENANT_ID:changeme}
        credential:
          client-id: ${AZURE_AD_CLIENT_ID:changeme}
        app-id-uri: ${AZURE_AD_APP_ID_URI:changeme}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ISSUER_URI:https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:changeme}/v2.0}

  flyway:
    enabled: true

report:
  timezone: ${TZ:America/Santiago}
  max-range-days: ${REPORT_MAX_RANGE_DAYS:1095}
  kafka:
    topic: ${KAFKA_BOOKINGS_TOPIC:bookings.events}
    dlt-topic: ${KAFKA_DLT_TOPIC:report.DLT}
    retry-attempts: ${KAFKA_RETRY_ATTEMPTS:3}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints.web.exposure.include: health,info
  endpoint.health.probes.enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}
