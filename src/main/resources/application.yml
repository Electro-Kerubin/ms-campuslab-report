spring:
  application:
    name: ms-campuslab-report
  datasource:
    url: jdbc:postgresql://localhost:5432/campuslab_report_db
    username: tu_usuario
    password: tu_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    azure:
      active-directory:
        enabled: true
        profile:
          tenant-id: ${AZURE_AD_TENANT_ID}
        credential:
          client-id: ${AZURE_AD_CLIENT_ID}
        app-id-uri: ${AZURE_AD_APP_ID_URI}
